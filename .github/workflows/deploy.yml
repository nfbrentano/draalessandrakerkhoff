name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 0' # Todo domingo à meia-noite (UTC)
  workflow_dispatch: # permite rodar manualmente (Actions › Run workflow ou `gh workflow run deploy.yml`)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo: o sitemap usa a data do último commit de cada página
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
